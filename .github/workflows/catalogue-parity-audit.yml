name: Catalogue parity audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only catalogue parity audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only audit dependency
        run: pip install requests

      - name: Audit current and historical catalogue sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/audit_catalogue_sources.py
