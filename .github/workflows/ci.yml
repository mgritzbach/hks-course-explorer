name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    # A bounded gate fails safely and leaves a diagnostic instead of consuming
    # a hosted runner indefinitely if a subprocess becomes unresponsive.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify vendored production dependencies
        run: npm run check:vendor-integrity

      - name: Block moderate-or-higher production dependency findings
        run: |
          audit_report="$RUNNER_TEMP/production-audit.json"
          npm audit --omit=dev --json > "$audit_report" || true
          node scripts/check_production_dependencies.mjs "$audit_report"

      - name: Lint
        run: npm run lint

      - name: Enforce JavaScript and JSX formatting
        run: npm run check:format

      - name: Type-check public frontend contracts
        run: npm run check:contracts

      - name: Enforce architecture size ratchet
        run: npm run check:architecture

      - name: Enforce UI complexity ratchet
        run: npm run check:ui-complexity

      - name: Validate frontend runtime contracts
        run: npm run check:runtime-contracts

      - name: Unit tests
        run: npm run test

      - name: Python sync safety tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Build deployable artifact
        run: npm run build
        env:
          NODE_ENV: production
          # Non-secret inert values make the local static artifact exercise
          # the same configuration contract as production. Browser tests mock
          # all REST traffic and never contact this host.
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key

      - name: Validate final Cloudflare Pages headers
        run: npm run check:pages-headers

      - name: Enforce route bundle budgets
        run: npm run check:bundle-budget

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against local preview
        run: npm run test:e2e:ci
