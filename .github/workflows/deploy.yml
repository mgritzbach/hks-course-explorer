name: Deploy to Cloudflare Pages

# Deployment is intentionally downstream of CI. A direct push or manual
# dispatch cannot bypass the exact-commit quality gate.
on:
  workflow_run:
    workflows: ['CI']
    branches: [master]
    types: [completed]

permissions:
  contents: read
  deployments: write

# A fixed release-candidate alias is safe only when releases cannot race.
concurrency:
  group: hks-production-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified master
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install pinned verification dependencies
        run: pip install --require-hashes -r requirements/workflows.txt

      - name: Validate target browser configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.DEPLOY_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEPLOY_VITE_SUPABASE_ANON_KEY }}
        run: node scripts/validate_supabase_browser_config.mjs

      - name: Verify active HKS catalogue manifest and exact row parity
        env:
          SUPABASE_URL: ${{ vars.DEPLOY_VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEPLOY_VITE_SUPABASE_ANON_KEY }}
          MAX_HKS_CATALOGUE_AGE_HOURS: '48'
        run: python scripts/verify_live_hks_catalogue.py

      - name: Build exact CI commit
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.DEPLOY_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEPLOY_VITE_SUPABASE_ANON_KEY }}

      - name: Validate final Cloudflare Pages headers
        run: npm run check:pages-headers

      - name: Install pinned Wrangler
        # 4.86.0 is the newest reviewed v4 release compatible with the
        # repository's pinned Node 20 deployment runner.
        run: npm install -g wrangler@4.86.0

      - name: Detect chat-rate-limiter changes
        id: rate-limiter
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- workers/chat-rate-limiter; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy isolated Pages release candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 54cdc2ac5fbe86216672ccf2589cf9cb
        run: >-
          wrangler pages deploy dist
          --project-name=hks-course-explorer
          --branch=release-candidate

      - name: Smoke-test exact release-candidate artifact
        env:
          DEPLOY_SMOKE_URL: https://release-candidate.hks-course-explorer.pages.dev/
        run: node scripts/smoke_deployed_site.mjs

      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium

      - name: Exercise release candidate in a real browser
        env:
          DEPLOY_SMOKE_URL: https://release-candidate.hks-course-explorer.pages.dev/
          DEPLOY_MIN_HKS_OFFERINGS: '285'
        run: npm run test:e2e:production

      - name: Refuse stale master promotion
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin master --depth=1
          latest_sha="$(git rev-parse origin/master)"
          if [ "$latest_sha" != "$TESTED_SHA" ]; then
            echo "Refusing stale release: tested $TESTED_SHA, current master $latest_sha" >&2
            exit 1
          fi

      - name: Preflight current custom-domain cache safety
        env:
          DEPLOY_SMOKE_URL: https://hks-course-explorer.org/
          DEPLOY_PREFLIGHT_ONLY: 'true'
        run: node scripts/smoke_deployed_site.mjs

      - name: Deploy atomic chat-rate limiter when changed
        if: steps.rate-limiter.outputs.changed == 'true'
        # The Pages chat handler fails closed without this Durable Object
        # namespace. Promote it only after the static/UI release candidate has
        # passed, then keep production promotion blocked if the update fails.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 54cdc2ac5fbe86216672ccf2589cf9cb
        run: wrangler deploy --config workers/chat-rate-limiter/wrangler.jsonc

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 54cdc2ac5fbe86216672ccf2589cf9cb
        run: wrangler pages deploy dist --project-name=hks-course-explorer --branch=master

      - name: Smoke-test deployed Pages entrypoint
        run: node scripts/smoke_deployed_site.mjs

      - name: Smoke-test custom production domain
        env:
          DEPLOY_SMOKE_URL: https://hks-course-explorer.org/
        run: node scripts/smoke_deployed_site.mjs

      - name: Exercise production in a real browser
        env:
          DEPLOY_SMOKE_URL: https://hks-course-explorer.org/
          DEPLOY_MIN_HKS_OFFERINGS: '285'
        run: npm run test:e2e:production

      - name: Retain production browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-browser-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record deployed commit
        run: echo "Deployed verified commit ${{ github.event.workflow_run.head_sha }}"
