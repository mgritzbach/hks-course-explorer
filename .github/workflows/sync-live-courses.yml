name: Sync live courses from Harvard API

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (3am ET / before Harvard business day)
  workflow_dispatch:        # allow manual trigger from GitHub UI

# A manual recovery run must not overlap the scheduled run: both would read
# the same upstream catalogue and race to promote it. Keep the earlier run
# intact and queue one follow-up instead of cancelling a valid promotion.
concurrency:
  group: hks-live-courses-production-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          # This workflow rejects deletion requests. Retained rows are counted
          # after each successful atomic upsert for a separately reviewed,
          # backed-up reconciliation; the sync itself never deletes data.
          SYNC_ALLOW_STALE_DELETE: 'false'
          # Production contains 1,555 offerings as of the established baseline.
          # Reject a materially incomplete upstream response before it can
          # refresh the catalogue. Revisit this only with audited term data.
          SYNC_MIN_UNIQUE_COURSES: '1200'
        run: python scripts/sync_live_courses.py
