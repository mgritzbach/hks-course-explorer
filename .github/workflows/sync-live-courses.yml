name: Sync non-HKS courses from Harvard API

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (3am ET / before Harvard business day)
  workflow_dispatch: # allow manual trigger from GitHub UI

# A manual recovery run must not overlap the scheduled run: both would read
# the same upstream catalogue and race to promote it. Keep the earlier run
# intact and queue one follow-up instead of cancelling a valid promotion.
concurrency:
  group: hks-production-catalogue-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements/workflows.txt

      - name: Run sync
        env:
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # This workflow rejects deletion requests. Retained rows are counted
          # after each successful atomic upsert for a separately reviewed,
          # backed-up reconciliation; the sync itself never deletes data.
          SYNC_ALLOW_STALE_DELETE: 'false'
          # HKS is owned by the separate authoritative my.harvard sync. This
          # job protects all other Harvard-school offerings without changing
          # which HKS rows are active.
          # Exact-master run 29189143811 promoted 5,607 non-HKS ATS rows after
          # the authoritative HKS ownership filter. Reject a drop below 5,000
          # (89.2% of that reviewed baseline) before any database write.
          # Recalibrate only from a successful, inventory-audited source run.
          SYNC_MIN_UNIQUE_COURSES: '5000'
        run: python scripts/sync_live_courses.py
