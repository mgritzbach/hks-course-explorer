name: Sync complete HKS catalogue from my.harvard

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

concurrency:
  group: hks-production-catalogue-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned workflow dependencies
        run: pip install --require-hashes -r requirements/workflows.txt

      - name: Stage, validate, and atomically promote HKS offerings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MYHARVARD_MIN_HKS_OFFERINGS: '285'
          MYHARVARD_PROMOTE: 'true'
        run: python scripts/sync_myharvard_hks.py
