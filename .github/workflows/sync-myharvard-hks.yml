name: Sync complete HKS catalogue from my.harvard

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Atomically promote after staging and verification'
        required: true
        type: boolean
        default: false

concurrency:
  group: hks-production-catalogue-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned workflow dependencies
        run: pip install --require-hashes -r requirements/workflows.txt

      - name: Stage, validate, and atomically promote HKS offerings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MYHARVARD_MIN_HKS_OFFERINGS: '285'
          # Scheduled runs keep the daily catalogue current. Manual runs are
          # staging-only by default so a new parser/source state can be
          # inspected without changing the active catalogue.
          MYHARVARD_PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote }}
        run: python scripts/sync_myharvard_hks.py

      - name: Open or update the HKS sync failure alert
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_ASSIGNEE: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 Daily HKS catalogue sync is failing"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="The automated daily HKS catalogue refresh failed. Course additions, credits, and meeting times may now be stale.\n\nFailed run: ${RUN_URL}\n\n@${ALERT_ASSIGNEE} — this needs attention before relying on the Schedule Builder."
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
            gh issue edit "$issue_number" --add-assignee "$ALERT_ASSIGNEE"
          else
            gh issue create --title "$title" --body "$body" --assignee "$ALERT_ASSIGNEE"
          fi

      - name: Close the HKS sync failure alert after recovery
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 Daily HKS catalogue sync is failing"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "The daily HKS catalogue sync recovered successfully: ${RUN_URL}"
          fi
