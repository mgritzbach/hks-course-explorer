name: Verify live ATS catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hks-production-catalogue-sync
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only ATS manifest and browser proof
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install pinned read-only verification dependency
        run: pip install --require-hashes -r requirements/workflows.txt

      - name: Verify private ATS and authoritative HKS manifests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/verify_live_ats_catalogue.py --github-env "$GITHUB_ENV"

      - name: Install browser dependencies
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Verify current and retained visibility on the custom domain
        env:
          DEPLOY_SMOKE_URL: https://hks-course-explorer.org/
        run: >-
          npx playwright test tests/production/ats-catalogue-closeout.spec.js
          --config=playwright.ats-production.config.js
